name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install -y vim-nox
          vim --version | head -2

      - name: Run the Vader suite
        run: make test VADER="$RUNNER_TEMP/vader"
